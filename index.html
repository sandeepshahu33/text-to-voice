<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text To Speech</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h2 class="heading"><i>Text To Speech Converter</i></h2>
    <div id="one">

            <textarea name="" id="text-sec" placeholder="Enter your text here..."></textarea>

    </div>
    <script src="js/script.js"></script>
</body>
</html>
